[project]
name = "mavitrine-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "email-validator>=2.2,<3", "python-multipart>=0.0.18,<1", "psycopg[binary]>=3.2,<4", "pillow>=11,<13"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
